<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="character-display">
                <div class="character-image">
                    <img :src="currentCharacter.imageUrl" @error="handleImageError" alt="Character">
                </div>
                <div class="character-info">
                    <h2>{{ currentCharacter.name }}, {{ currentCharacter.age }}</h2>
                    <p>{{ currentCharacter.bio }}</p>
                </div>
            </div>
            
            <div class="dialog-box">
                <p v-if="gameState === 'intro'">{{ introText }}</p>
                <p v-else-if="gameState === 'conversation'">{{ currentDialog }}</p>
                <p v-else-if="gameState === 'ending'">{{ endingText }}</p>
                
                <div v-if="gameState === 'conversation'" class="choices-container">
                    <button 
                        v-for="(choice, index) in currentChoices" 
                        :key="index" 
                        @click="makeChoice(index)"
                        class="choice-btn">
                        {{ choice.text }}
                    </button>
                </div>
                
                <button v-if="gameState === 'intro'" @click="startGame" class="action-btn">Start Dating</button>
                <button v-if="gameState === 'ending'" @click="resetGame" class="action-btn">Play Again</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>

</body>
</html>
